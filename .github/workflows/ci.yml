name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a newly published advisory turns the audit red even when
  # nobody pushes.
  schedule:
    - cron: "0 5 * * 1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Gate on high+ only: moderate advisories in framework-pinned transitive
      # deps (e.g. postcss via next) have no non-breaking fix and would make
      # the pipeline permanently red. Production deps only: what ships is what
      # the gate protects. Dev tooling is reported below without failing the
      # build — GHSA-vfj7-8cjw-p6xm (braces, via the shadcn CLI and eslint) has
      # no patched release, so gating on it could only be fixed by waiting.
      - name: Audit production dependencies (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dev tooling (report only)
        run: npm audit --audit-level=high || true

      - name: Production build
        run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image is what Coolify deploys — a Dockerfile that stopped building
      # would otherwise only show up there.
      - name: Build image
        run: docker build -t invoiceflow:ci .

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Audit dependencies (high and above)
        run: npm audit --audit-level=high